[package]
name = "basalt-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Basalt transport: framed TLS connections, SPKI pinning and PIN pairing."

[dependencies]
basalt-proto = { workspace = true }

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# `ring` rather than aws-lc-rs: aws-lc-sys needs cmake and a C toolchain, which
# is a needless build dependency for a LAN app. It is also already in the tree
# as rustls' backend, so using it directly for HMAC, SHA-256 and randomness
# costs nothing rather than pulling in three more crates.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
x509-parser = "0.18"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
