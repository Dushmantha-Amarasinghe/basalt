[package]
name = "basalt-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Basalt client: session, transfers and media proxy."

[lib]
name = "basalt_client"
path = "src/lib.rs"

[[bin]]
name = "basalt"
path = "src/main.rs"

[dependencies]
basalt-proto = { workspace = true }
basalt-net = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_Security_Cryptography"] }

[dev-dependencies]
basalt-host = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
