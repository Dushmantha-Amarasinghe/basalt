[package]
name = "basalt-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Basalt host: serves one locked-in drive over the LAN."

[lib]
name = "basalt_host"
path = "src/lib.rs"

[[bin]]
name = "basalt-host"
path = "src/main.rs"

[dependencies]
basalt-proto = { workspace = true }
basalt-net = { workspace = true }
basalt-catalog = { workspace = true }

anyhow = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ring = "0.17"
# Photo headers for the Photos grid, and thumbnails. Only the formats a
# camera or a screenshot produces; each one is a decoder compiled in.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
# libmpv, loaded at run time for video thumbnails. Loaded rather than linked
# so a host without the DLL still starts, and simply makes no video pictures.
libloading = "0.8"
# Profile PINs, hashed the way passwords are.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# `rustls-no-provider` rather than `rustls`, which would pull aws-lc-rs and with
# it a cmake build dependency this project deliberately does not have. The ring
# provider is already installed process-wide by `basalt-net::tls`, so reqwest
# finds one waiting for it.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "charset",
    "http2",
    "json",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_WindowsProgramming",
] }
