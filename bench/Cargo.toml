[package]
name = "basalt-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Phase 0 measurement harness: does a custom protocol actually beat SMB on this link?"

[[bin]]
name = "basalt-bench"
path = "src/main.rs"

[dependencies]
basalt-proto = { workspace = true }

anyhow = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zstd = { workspace = true }
# `ring` rather than the default aws-lc-rs backend: aws-lc-sys needs cmake and
# a full C toolchain, which is a needless build dependency for a LAN app.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
walkdir = "2.5"
