[package]
name = "basalt-client-shell"
version = "1.3.0"
edition = "2021"
description = "Basalt client shell: Windows and Android"
rust-version = "1.82"

[lib]
name = "basalt_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The client and protocol crates live outside this Cargo workspace on purpose:
# Tauri pulls in a very large dependency tree, and keeping it out means
# `cargo test` — and so the pre-commit hook — stays a few seconds rather than a
# few minutes.
basalt-client = { path = "../../../crates/basalt-client" }
basalt-proto = { path = "../../../crates/basalt-proto" }
basalt-update = { path = "../../../crates/basalt-update" }

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
base64 = "0.23.1"
# Files, downloads, sharing, staying awake: what the app needs from Android.
# A no-op anywhere else.
tauri-plugin-basalt-android = { path = "plugins/basalt-android" }

# The player. libmpv drawn behind the window, on the desktop only: the plugin
# has no Android side, and the Android app brings its own.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-libmpv = "0.3.2"
