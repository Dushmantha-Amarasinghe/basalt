[package]
name = "tauri-plugin-basalt-android"
version = "0.1.0"
edition = "2021"
description = "What the Basalt app needs from Android itself: files, downloads, sharing, staying awake, the screen, updates."
publish = false
links = "tauri-plugin-basalt-android"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
